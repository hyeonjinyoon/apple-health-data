[project]
name = "health-ingest"
version = "0.1.0"
description = "Apple Health (iPhone) -> ClickHouse ingest API for Grafana dashboards"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "httpx>=0.27",
    "uvicorn>=0.32",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
]

[tool.pytest.ini_options]
pythonpath = [".", "tests"]
testpaths = ["tests"]
markers = ["integration: needs a real ClickHouse (see tests/test_integration.py)"]
filterwarnings = ["ignore:Using .httpx. with .starlette.testclient. is deprecated"]
