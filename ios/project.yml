# XcodeGen spec — generate the Xcode project with `make project` (or `xcodegen generate`).
# Signing (team / bundle id prefix) lives in Config/Signing.xcconfig (git-ignored): `make signing TEAM=XXXXXXXXXX`.
name: HealthSync
options:
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  HealthSync:
    type: application
    platform: iOS
    sources:
      - path: HealthSync
    info:
      path: HealthSync/Info.plist
      properties:
        CFBundleDisplayName: HealthSync
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        ITSAppUsesNonExemptEncryption: false
        NSHealthShareUsageDescription: 건강 앱의 데이터를 읽어 내 Mac mini 서버로 전송하고 Grafana 대시보드로 보여줍니다.
        NSHealthUpdateUsageDescription: HealthSync는 건강 데이터를 쓰지 않습니다.
        NSLocalNetworkUsageDescription: 같은 네트워크에 있는 Mac mini 서버로 건강 데이터를 전송합니다.
        # Plain HTTP is allowed so the app can reach the Mac over LAN/Tailscale IPs; the app itself
        # refuses http:// to non-private hosts (see ServerConfig.isPrivateHost).
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        UIBackgroundModes: [fetch]
        BGTaskSchedulerPermittedIdentifiers: ["$(PRODUCT_BUNDLE_IDENTIFIER).refresh"]
        CFBundleURLTypes:
          - CFBundleURLName: $(PRODUCT_BUNDLE_IDENTIFIER)
            CFBundleURLSchemes: [healthsync]
    entitlements:
      path: HealthSync/HealthSync.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
        com.apple.developer.healthkit.background-delivery: true
    attributes:
      SystemCapabilities:
        com.apple.HealthKit:
          enabled: 1
        com.apple.BackgroundModes:
          enabled: 1
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).healthsync
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: YES
  HealthSyncTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: HealthSyncTests
    dependencies:
      - target: HealthSync
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).healthsync.tests
        GENERATE_INFOPLIST_FILE: YES
  HealthSyncUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: HealthSyncUITests
    dependencies:
      - target: HealthSync
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).healthsync.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: HealthSync
schemes:
  HealthSync:
    build:
      targets:
        HealthSync: all
        HealthSyncTests: [test]
        HealthSyncUITests: [test]
    test:
      targets: [HealthSyncTests, HealthSyncUITests]
